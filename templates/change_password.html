{% extends "base.html" %}{% block head %}CHANGE PASSWORD{% endblock %}
{% block body %}
<div class="card" style="max-width:420px">
  <h3>SECURITY — FIRST LOGIN</h3>
  <p class="muted" style="margin-bottom:14px">You must set a new password before continuing. Minimum 6 characters.</p>
  {% if err %}<div class="err">{{ err }}</div>{% endif %}
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>New password</label><input type="password" name="p1" required>
    <label>Confirm password</label><input type="password" name="p2" required>
    <button class="btn">SAVE PASSWORD</button>
  </form>
</div>
{% endblock %}
